<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tennis Live Pro · Single / Double / Pro‑Am</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0b0b;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      color: #fff;
    }
    .app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      background: #121212;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .screen.active {
      display: flex;
    }
    .navbar {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      background: #1c1c1c;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .navbar button {
      background: #2a2a2a;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.8rem;
      color: #ccc;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
    }
    .navbar button.active {
      background: #ff9f0a;
      color: #000;
    }
    .card {
      background: #1e1e1e;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }
    .card h2,
    .card h3 {
      margin-bottom: 16px;
      font-weight: 600;
      color: #fff;
    }
    .input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #333;
      border-radius: 16px;
      font-size: 1rem;
      margin: 6px 0;
      background: #2a2a2a;
      color: #fff;
      outline: none;
      -webkit-appearance: none;
    }
    .input:focus {
      border-color: #ff9f0a;
      box-shadow: 0 0 0 3px rgba(255, 159, 10, 0.2);
    }
    .input::placeholder {
      color: #777;
    }
    select.input {
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="%23aaa"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 16px center;
      background-size: 18px;
    }
    .btn {
      background: #2a2a2a;
      border: none;
      padding: 14px 24px;
      border-radius: 28px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ddd;
      touch-action: manipulation;
    }
    .btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }
    .btn.primary {
      background: #ff9f0a;
      color: #000;
      font-weight: 700;
    }
    .btn.danger {
      background: #ff3b30;
      color: #fff;
      font-weight: 700;
    }
    .btn.success {
      background: #30d158;
      color: #000;
      font-weight: 700;
    }
    .btn.small {
      padding: 8px 14px;
      font-size: 0.8rem;
      border-radius: 16px;
    }
    .btn.block {
      width: 100%;
      margin: 6px 0;
    }
    .big-score-btns {
      display: flex;
      gap: 12px;
      margin: 12px 0;
      flex-shrink: 0;
    }
    .big-point-btn {
      flex: 1;
      min-height: 130px;
      border-radius: 28px;
      border: none;
      font-size: 1.6rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.12s;
      color: #fff;
      letter-spacing: 1px;
    }
    .big-point-btn:active {
      transform: scale(0.94);
      filter: brightness(1.2);
    }
    .big-point-btn.left {
      background: linear-gradient(145deg, #0a84ff, #0066d6);
      box-shadow: 0 8px 24px rgba(10, 132, 255, 0.35);
    }
    .big-point-btn.right {
      background: linear-gradient(145deg, #ff375f, #d6002c);
      box-shadow: 0 8px 24px rgba(255, 55, 95, 0.35);
    }
    .big-point-btn .label {
      font-size: 0.8rem;
      font-weight: 500;
      opacity: 0.85;
    }
    .scoreboard {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin: 8px 0;
      flex-shrink: 0;
    }
    .player-side {
      flex: 1;
      background: #2a2a2a;
      border-radius: 22px;
      padding: 12px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background 0.2s;
    }
    .player-side.serving {
      background: #2e3520;
      box-shadow: inset 0 0 0 2px #30d158;
    }
    .player-name {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .serve-dot {
      width: 10px;
      height: 10px;
      background: #30d158;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 10px #30d158;
      animation: pulse 1.4s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.35;
      }
    }
    .sets-display {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ff9f0a;
    }
    .games-display {
      font-size: 1.1rem;
      font-weight: 700;
      background: #3a3a3a;
      padding: 4px 14px;
      border-radius: 16px;
      display: inline-block;
      margin: 0 auto;
    }
    .points-display {
      font-size: 2.4rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      transition: transform 0.15s;
    }
    .points-display.pulse {
      transform: scale(1.2);
      color: #ff9f0a;
    }
    .vs-divider {
      display: flex;
      align-items: center;
      font-weight: 700;
      color: #555;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: #1a1a1a;
      border-radius: 16px;
      padding: 10px 14px;
      margin: 8px 0;
      flex-shrink: 0;
    }
    .stats-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 4px 0;
    }
    .stat-badge {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.75rem;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .stat-badge strong {
      color: #ff9f0a;
      font-weight: 700;
    }
    .list-item {
      background: #2a2a2a;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      transition: background 0.12s;
    }
    .list-item:active {
      background: #3a3a3a;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    .modal {
      background: #1e1e1e;
      border-radius: 28px;
      padding: 20px;
      max-width: 90vw;
      width: 350px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal h4 {
      color: #fff;
      text-align: center;
    }
    .modal button {
      background: #2a2a2a;
      border: none;
      padding: 14px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      color: #ddd;
    }
    .modal button.primary {
      background: #ff9f0a;
      color: #000;
    }
    ::-webkit-scrollbar {
      width: 3px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="app" id="appContainer">
    <div class="navbar" id="mainNav" style="display:none"></div>

    <div class="screen active" id="screen-role">
      <div style="display:flex; flex-direction:column; gap:20px; justify-content:center; align-items:center; flex:1;">
        <button class="btn primary" style="padding:32px 40px; font-size:1.6rem; width:90%;" id="btnJudge">👨‍⚖️ Судья</button>
        <button class="btn" style="padding:32px 40px; font-size:1.6rem; width:90%; background:#333;" id="btnSpectator">👀 Зритель</button>
      </div>
    </div>

    <div class="screen" id="screen-judge-list">
      <div class="card"><h3>⚡ Мои матчи</h3><div id="judgeMatchList"></div>
        <button id="btnNewMatch" class="btn primary block" style="margin-top:12px;">➕ Новый матч</button>
        <button id="btnBackRoleJudge" class="btn block">↩️ Сменить роль</button>
      </div>
    </div>

    <div class="screen" id="screen-setup">
      <div class="card"><h2>🎾 Новый матч</h2>
        <label style="color:#aaa;">Турнир</label>
        <div style="display:flex; gap:8px;"><select id="inpTournamentSelect" class="input" style="flex:1;"></select><button id="btnNewTournament" class="btn small">+</button></div>
        <label style="color:#aaa;">Режим</label>
        <select id="inpMode" class="input"><option value="single">Одиночный</option><option value="double">Парный</option><option value="proam">Pro‑Am</option></select>
        <div id="playersInputs"></div>
        <button id="btnCreateMatch" class="btn primary block">Создать матч</button>
        <button id="btnBackSetup" class="btn block">↩️ К списку</button>
      </div>
    </div>

    <div class="screen" id="screen-match">
      <div class="card" style="padding:12px; display:flex; flex-direction:column; gap:8px;">
        <div style="text-align:center; font-weight:600; color:#ff9f0a;" id="matchTournament"></div>
        <div class="scoreboard">
          <div class="player-side" id="sideLeftBox"><div class="player-name" id="playerLeftName"></div><div class="sets-display" id="setsLeft">0</div><div class="games-display" id="gamesLeft">0</div><div class="points-display" id="pointsLeft">0</div></div>
          <div class="vs-divider">VS</div>
          <div class="player-side" id="sideRightBox"><div class="player-name" id="playerRightName"></div><div class="sets-display" id="setsRight">0</div><div class="games-display" id="gamesRight">0</div><div class="points-display" id="pointsRight">0</div></div>
        </div>
        <div class="big-score-btns">
          <button class="big-point-btn left" id="btnPointLeft"><span class="label">ОЧКО</span> 🎾</button>
          <button class="big-point-btn right" id="btnPointRight"><span class="label">ОЧКО</span> 🎾</button>
        </div>
        <div class="stats-row"><span class="stat-badge">Очки: <strong id="statPoints">0</strong></span><span class="stat-badge">Геймы: <strong id="statGames">0</strong></span><span class="stat-badge">1‑я подача: <strong id="statServe">-</strong>%</span></div>
        <div class="info-bar"><span id="matchStatus"></span><div><button id="btnUndo" class="btn small" disabled>↩️</button><button id="btnEndMatch" class="btn small danger">Завершить</button><button id="btnInterruptMatch" class="btn small" style="background:#ff9f0a;color:#000;">Прервать</button></div></div>
        <div id="servePrompt" style="display:none; text-align:center;"><span style="color:#aaa;">1‑я подача:</span><button id="btnServeIn" class="btn small success">✅</button><button id="btnServeMiss" class="btn small danger">❌</button></div>
      </div>
    </div>

    <div class="screen" id="screen-tournaments">
      <div class="card"><h3>🏆 Турниры</h3><div id="tournamentList"></div>
        <button id="btnCreateTournament" class="btn primary block" style="margin-top:12px;">➕ Новый турнир</button>
        <button id="btnBackFromTournaments" class="btn block">↩️ Назад</button>
      </div>
    </div>
    <div class="screen" id="screen-tournament-detail">
      <div class="card"><button id="btnBackToTournamentList" class="btn small">↩️ К списку</button><h3 id="detailTournamentName"></h3><div id="tournamentMatchesContainer"></div></div>
    </div>
    <div class="screen" id="screen-history">
      <div class="card"><h3>📋 История матчей</h3><div id="historyList"></div><button id="btnBackFromHistory" class="btn block">↩️ Назад</button></div>
    </div>

    <div class="screen" id="screen-spec-list">
      <div class="card"><h3>📺 Сейчас играют</h3><div id="liveMatchList"></div><button id="btnBackRoleSpec" class="btn block" style="margin-top:12px;">↩️ Сменить роль</button></div>
    </div>
    <div class="screen" id="screen-broadcast">
      <div class="card" style="text-align:center;"><div id="broadcastContent"></div><button id="btnBackSpecList" class="btn block" style="margin-top:12px;">↩️ К списку</button></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getDatabase, ref, push, set, update, remove, get, onValue, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBX9b5aUvTxqUU7wCoLrSZj4iDQQMuOcY",
      authDomain: "tennislive-3d29d.firebaseapp.com",
      databaseURL: "https://tennislive-3d29d-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "tennislive-3d29d",
      storageBucket: "tennislive-3d29d.firebasestorage.app",
      messagingSenderId: "218839864905",
      appId: "1:218839864905:web:40c9f735f9111c02371198"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);

    // ────────────────────────────────────
    // Игровой движок (конфиг)
    const MODES = {
      single: { setsToWin: 2, gamesToWin: 6, tiebreakAt: 6, noAd: false, specialDeuce: false, extendedSet: false },
      double: { setsToWin: 2, gamesToWin: 6, tiebreakAt: 6, noAd: true, specialDeuce: false, extendedSet: false },
      proam: { setsToWin: 1, gamesToWin: 8, tiebreakAt: 8, noAd: false, specialDeuce: true, extendedSet: true }
    };

    function formatPoints(points, isTiebreak) {
      if (isTiebreak) return [String(points[0]), String(points[1])];
      const [p0, p1] = points;
      if (p0 >= 3 && p1 >= 3) {
        if (p0 === p1) return ['40', '40'];
        return p0 > p1 ? ['AD', '40'] : ['40', 'AD'];
      }
      const map = ['0', '15', '30', '40'];
      return [map[Math.min(p0, 3)] || '40', map[Math.min(p1, 3)] || '40'];
    }

    function isGameWon(points, isTiebreak, config, deuceCount) {
      const [p0, p1] = points;
      if (isTiebreak) return (p0 >= 7 || p1 >= 7) && Math.abs(p0 - p1) >= 2;
      if (config.noAd) return p0 >= 4 || p1 >= 4;
      // Standard или specialDeuce
      if (config.specialDeuce && p0 >= 3 && p1 >= 3) {
        if (deuceCount > 1) {
          // Решающий мяч: как только один набирает преимущество (разница 1 после deuce)
          return Math.abs(p0 - p1) === 1 && (p0 >= 4 || p1 >= 4);
        } else {
          // Обычный AD: разница 2
          return (p0 >= 4 || p1 >= 4) && Math.abs(p0 - p1) >= 2;
        }
      }
      return (p0 >= 4 || p1 >= 4) && Math.abs(p0 - p1) >= 2;
    }

    function otherSide(side) {
      return side === 'left' ? 'right' : 'left';
    }

    // ────────────────────────────────────
    // Firebase API
    async function createTournament(name) {
      const r = push(ref(db, 'tournaments'));
      await set(r, { name, createdAt: serverTimestamp() });
      return r.key;
    }

    async function loadTournamentSelect() {
      const snap = await get(ref(db, 'tournaments'));
      const tours = snap.val() || {};
      const select = $('#inpTournamentSelect');
      select.innerHTML = Object.entries(tours).map(([id, t]) => `<option value="${id}">${t.name}</option>`).join('');
      if (!select.innerHTML) select.innerHTML = '<option value="">-- Создайте турнир --</option>';
    }

    async function createMatchInDB(data) {
      const mRef = push(ref(db, 'matches'));
      const id = mRef.key;
      const modeConfig = MODES[data.mode];
      const match = {
        id,
        tournamentId: data.tournamentId,
        tournamentName: data.tournamentName,
        mode: data.mode,
        players: { left: { name: data.playerLeft }, right: { name: data.playerRight } },
        score: {
          sets: [0, 0],
          currentSet: {
            games: [0, 0],
            points: [0, 0],
            serveSide: 'left',
            isTiebreak: false,
            deuceCount: 0
          }
        },
        status: { phase: 'playing', winner: null },
        stats: { totalPoints: 0, totalGames: 0, firstServeIn: 0, firstServeTotal: 0 },
        history: [],
        config: { ...modeConfig },
        createdAt: serverTimestamp()
      };
      await set(mRef, match);
      await set(ref(db, `matchList/${id}`), {
        tournament: match.tournamentName,
        playerLeft: data.playerLeft,
        playerRight: data.playerRight,
        scoreSummary: '0:0',
        phase: 'playing',
        updatedAt: serverTimestamp()
      });
      return id;
    }

    // ────────────────────────────────────
    // Глобальное состояние
    let currentRole = null;
    let currentMatchId = null;
    let unsubMatch = null;
    let unsubList = null;
    let pointLock = false;
    let lastPointSide = null;
    let serveTimeout = null;

    function clearMatchSub() {
      if (unsubMatch) { unsubMatch(); unsubMatch = null; }
      if (serveTimeout) { clearTimeout(serveTimeout); $('#servePrompt').style.display = 'none'; }
    }

    function clearListSub() {
      if (unsubList) { unsubList(); unsubList = null; }
    }

    function showScreen(id) {
      $$('.screen').forEach(s => s.classList.remove('active'));
      $(`#screen-${id}`).classList.add('active');
      updateNavHighlight(id);
      $('#appContainer').scrollTop = 0;
    }

    function setRole(role) {
      currentRole = role;
      buildNav(role);
      if (role === 'judge') { showScreen('judge-list'); subscribeJudgeList(); }
      else { showScreen('spec-list'); subscribeLiveList(); }
    }

    function buildNav(role) {
      const nav = $('#mainNav');
      nav.innerHTML = '';
      const tabs = role === 'judge'
        ? [{ s: 'judge-list', l: '⚡ Матчи' }, { s: 'tournaments', l: '🏆 Турниры' }, { s: 'history', l: '📋 История' }]
        : [{ s: 'spec-list', l: '📺 Live' }, { s: 'tournaments', l: '🏆 Турниры' }, { s: 'history', l: '📋 История' }];
      tabs.forEach(t => {
        const b = document.createElement('button');
        b.className = 'nav-tab';
        b.dataset.screen = t.s;
        b.textContent = t.l;
        b.addEventListener('click', () => {
          showScreen(t.s);
          if (t.s === 'judge-list') subscribeJudgeList();
          else if (t.s === 'spec-list') subscribeLiveList();
          else if (t.s === 'tournaments') subscribeTournaments();
          else if (t.s === 'history') subscribeHistory();
        });
        nav.appendChild(b);
      });
      nav.style.display = 'flex';
    }

    function updateNavHighlight(id) {
      $$('.nav-tab').forEach(b => b.classList.toggle('active', b.dataset.screen === id));
    }

    function subscribeMatch(matchId) {
      clearMatchSub();
      unsubMatch = onValue(ref(db, `matches/${matchId}`), snap => {
        const m = snap.val();
        if (!m) {
          if (currentRole === 'judge') { alert('Матч удалён.'); currentMatchId = null; showScreen('judge-list'); }
          else $('#broadcastContent').innerHTML = '<p style="color:#ff3b30;">Матч завершён.</p>';
          return;
        }
        if (currentRole === 'judge' && currentMatchId === matchId) renderJudgeUI(m);
        else if (currentRole === 'spectator' && currentMatchId === matchId) renderBroadcastUI(m);
      });
    }

    function renderJudgeUI(m) {
      const cur = m.score.currentSet;
      const pts = formatPoints(cur.points, cur.isTiebreak);
      const leftName = m.players.left.name + (cur.serveSide === 'left' ? ' <span class="serve-dot"></span>' : '');
      const rightName = (cur.serveSide === 'right' ? '<span class="serve-dot"></span> ' : '') + m.players.right.name;
      $('#playerLeftName').innerHTML = leftName;
      $('#playerRightName').innerHTML = rightName;
      $('#setsLeft').textContent = m.score.sets[0];
      $('#setsRight').textContent = m.score.sets[1];
      $('#gamesLeft').textContent = cur.games[0];
      $('#gamesRight').textContent = cur.games[1];
      $('#pointsLeft').textContent = pts[0];
      $('#pointsRight').textContent = pts[1];
      $('#matchTournament').textContent = m.tournamentName || 'Турнир';
      $('#sideLeftBox').classList.toggle('serving', cur.serveSide === 'left');
      $('#sideRightBox').classList.toggle('serving', cur.serveSide === 'right');
      const st = m.stats || {};
      $('#statPoints').textContent = st.totalPoints || 0;
      $('#statGames').textContent = st.totalGames || 0;
      const pct = st.firstServeTotal > 0 ? Math.round(st.firstServeIn / st.firstServeTotal * 100) : '-';
      $('#statServe').textContent = pct;
      const w = m.status.winner;
      if (w) {
        $('#matchStatus').textContent = `🏆 Победитель: ${w === 'left' ? m.players.left.name : m.players.right.name}`;
        $('#btnPointLeft').disabled = $('#btnPointRight').disabled = true;
        $('#btnEndMatch').style.display = 'none';
        $('#btnInterruptMatch').textContent = 'Удалить';
      } else if (m.status.phase === 'interrupted') {
        $('#matchStatus').textContent = '⏸️ Прерван';
        $('#btnPointLeft').disabled = $('#btnPointRight').disabled = true;
        $('#btnInterruptMatch').textContent = 'Продолжить';
      } else {
        $('#matchStatus').textContent = '🎾 В игре';
        $('#btnPointLeft').disabled = $('#btnPointRight').disabled = false;
        $('#btnInterruptMatch').textContent = 'Прервать';
      }
      $('#btnUndo').disabled = !(m.history && m.history.length > 0);
    }

    function renderBroadcastUI(m) {
      const cur = m.score.currentSet;
      const pts = formatPoints(cur.points, cur.isTiebreak);
      const serve = cur.serveSide === 'left' ? `Подаёт: ${m.players.left.name}` : `Подаёт: ${m.players.right.name}`;
      const status = m.status.winner ? `🏆 Победитель: ${m.status.winner === 'left' ? m.players.left.name : m.players.right.name}` :
        (m.status.phase === 'interrupted' ? '⏸️ Прерван' : '🎾 В игре');
      $('#broadcastContent').innerHTML = `
        <h3 style="color:#ff9f0a;">${m.tournamentName||'Турнир'}</h3>
        <div style="display:flex; justify-content:space-around; gap:8px; margin:16px 0;">
          <div><strong>${m.players.left.name}</strong><br><span style="font-size:2rem;">${m.score.sets[0]}</span><br>${cur.games[0]}<br><span style="font-size:2.4rem;">${pts[0]}</span></div>
          <div>VS</div>
          <div><strong>${m.players.right.name}</strong><br><span style="font-size:2rem;">${m.score.sets[1]}</span><br>${cur.games[1]}<br><span style="font-size:2.4rem;">${pts[1]}</span></div>
        </div>
        <p>${serve}</p><p>${status}</p>
      `;
    }

    async function updateMatchIndex(matchId, m) {
      const cur = m.score.currentSet;
      await update(ref(db), {
        [`matchList/${matchId}/scoreSummary`]: `${m.score.sets[0]}:${m.score.sets[1]} (${cur.games[0]}:${cur.games[1]})`,
        [`matchList/${matchId}/phase`]: m.status.winner ? 'finished' : m.status.phase,
        [`matchList/${matchId}/updatedAt`]: serverTimestamp()
      });
    }

    // ────────────────────────────────────
    // Игровые действия
    async function addPoint(side) {
      if (pointLock || !currentMatchId || currentRole !== 'judge') return;
      pointLock = true;
      const matchRef = ref(db, `matches/${currentMatchId}`);
      try {
        await runTransaction(matchRef, current => {
          if (!current || current.status.winner || current.status.phase === 'interrupted') return;
          const cfg = current.config;
          const cur = current.score.currentSet;
          const idx = side === 'left' ? 0 : 1;
          const opp = 1 - idx;
          cur.points[idx]++;
          current.stats.totalPoints = (current.stats.totalPoints || 0) + 1;
          if (!current.history) current.history = [];
          current.history.push({
            action: 'point', side,
            timestamp: Date.now(),
            scoreBefore: {
              sets: [...current.score.sets],
              games: [...cur.games],
              points: [cur.points[0] - (idx === 0 ? 1 : 0), cur.points[1] - (idx === 1 ? 1 : 0)],
              isTiebreak: cur.isTiebreak,
              deuceCount: cur.deuceCount
            }
          });
          // Проверка выигрыша гейма
          if (isGameWon(cur.points, cur.isTiebreak, cfg, cur.deuceCount)) {
            cur.games[idx]++;
            current.stats.totalGames = (current.stats.totalGames || 0) + 1;
            cur.points = [0, 0];
            cur.serveSide = otherSide(cur.serveSide);
            cur.deuceCount = 0;
            current.history.push({ action: 'game', side, timestamp: Date.now() });
            let setWon = false;
            if (cur.isTiebreak) {
              setWon = true;
              cur.isTiebreak = false;
            } else {
              if (cfg.extendedSet) {
                if ((cur.games[0] >= cfg.gamesToWin && cur.games[0] - cur.games[1] >= 2) ||
                  (cur.games[1] >= cfg.gamesToWin && cur.games[1] - cur.games[0] >= 2)) setWon = true;
                else if (cur.games[0] === cfg.tiebreakAt && cur.games[1] === cfg.tiebreakAt) {
                  cur.isTiebreak = true;
                  cur.points = [0, 0];
                }
              } else {
                if ((cur.games[0] >= cfg.gamesToWin && cur.games[0] - cur.games[1] >= 2) ||
                  (cur.games[1] >= cfg.gamesToWin && cur.games[1] - cur.games[0] >= 2)) setWon = true;
                else if (cur.games[0] === cfg.tiebreakAt && cur.games[1] === cfg.tiebreakAt) {
                  cur.isTiebreak = true;
                  cur.points = [0, 0];
                }
              }
            }
            if (setWon) {
              current.score.sets[idx]++;
              cur.games = [0, 0];
              cur.isTiebreak = false;
              current.history.push({ action: 'set', side, timestamp: Date.now() });
              if (current.score.sets[idx] >= cfg.setsToWin) {
                current.status.winner = side;
                current.status.phase = 'finished';
                current.history.push({ action: 'match', side, timestamp: Date.now() });
              }
            }
          } else if (cfg.specialDeuce) {
            // Обновление deuceCount при deuce
            const [p0, p1] = cur.points;
            if (p0 >= 3 && p1 >= 3 && p0 === p1) {
              cur.deuceCount = (cur.deuceCount || 0) + 1;
            }
          }
          return current;
        });
        const snap = await get(matchRef);
        const m = snap.val();
        if (m) {
          await updateMatchIndex(currentMatchId, m);
          renderJudgeUI(m);
          lastPointSide = side;
          showServePrompt();
        }
      } catch (e) { alert('Ошибка: ' + e.message); }
      finally { pointLock = false; }
    }

    function showServePrompt() {
      if (serveTimeout) clearTimeout(serveTimeout);
      $('#servePrompt').style.display = 'flex';
      serveTimeout = setTimeout(() => { $('#servePrompt').style.display = 'none'; lastPointSide = null; }, 8000);
    }

    async function recordServe(result) {
      if (!currentMatchId || !lastPointSide) return;
      const matchRef = ref(db, `matches/${currentMatchId}`);
      await runTransaction(matchRef, cur => {
        if (!cur) return;
        if (!cur.stats) cur.stats = { totalPoints: 0, totalGames: 0, firstServeIn: 0, firstServeTotal: 0 };
        cur.stats.firstServeTotal++;
        if (result === 'in') cur.stats.firstServeIn++;
        return cur;
      });
      const snap = await get(matchRef);
      const m = snap.val();
      if (m) { renderJudgeUI(m); await updateMatchIndex(currentMatchId, m); }
      $('#servePrompt').style.display = 'none';
      lastPointSide = null;
      clearTimeout(serveTimeout);
    }

    async function undoLastPoint() {
      if (!currentMatchId) return;
      const matchRef = ref(db, `matches/${currentMatchId}`);
      await runTransaction(matchRef, cur => {
        if (!cur || !cur.history || cur.history.length === 0) return;
        let idx = -1;
        for (let i = cur.history.length - 1; i >= 0; i--) {
          if (cur.history[i].action === 'point') { idx = i; break; }
        }
        if (idx === -1) return;
        const before = cur.history[idx].scoreBefore;
        if (!before) return;
        cur.score.sets = before.sets;
        cur.score.currentSet.games = before.games;
        cur.score.currentSet.points = before.points;
        cur.score.currentSet.isTiebreak = before.isTiebreak;
        cur.score.currentSet.deuceCount = before.deuceCount;
        cur.stats.totalPoints = Math.max(0, (cur.stats.totalPoints || 0) - 1);
        cur.history = cur.history.slice(0, idx);
        if (cur.status.winner) { cur.status.winner = null; cur.status.phase = 'playing'; }
        const totalGames = before.games[0] + before.games[1];
        cur.score.currentSet.serveSide = (totalGames % 2 === 0) ? 'left' : 'right';
        return cur;
      });
      const snap = await get(matchRef);
      const m = snap.val();
      if (m) { renderJudgeUI(m); await updateMatchIndex(currentMatchId, m); }
    }

    async function endMatch() {
      if (!currentMatchId) return;
      const m = await get(ref(db, `matches/${currentMatchId}`));
      if (!m) return;
      if (!confirm('Завершить матч?')) return;
      await update(ref(db, `matches/${currentMatchId}`), {
        'status/phase': 'finished',
        'status/winner': m.status.winner || 'left',
        finishedAt: serverTimestamp()
      });
      await updateMatchIndex(currentMatchId, { ...m, status: { ...m.status, phase: 'finished' } });
    }

    async function interruptMatch() {
      if (!currentMatchId) return;
      const m = await get(ref(db, `matches/${currentMatchId}`));
      if (!m) return;
      if (m.status.phase === 'interrupted') {
        await update(ref(db, `matches/${currentMatchId}`), { 'status/phase': 'playing' });
        await updateMatchIndex(currentMatchId, { ...m, status: { ...m.status, phase: 'playing' } });
      } else {
        if (!confirm('Прервать матч?')) return;
        await update(ref(db, `matches/${currentMatchId}`), { 'status/phase': 'interrupted' });
        await updateMatchIndex(currentMatchId, { ...m, status: { ...m.status, phase: 'interrupted' } });
      }
    }

    async function deleteMatch() {
      if (!currentMatchId) return;
      if (!confirm('Удалить матч безвозвратно?')) return;
      await remove(ref(db, `matches/${currentMatchId}`));
      await remove(ref(db, `matchList/${currentMatchId}`));
      currentMatchId = null;
      clearMatchSub();
      showScreen('judge-list');
    }

    // ────────────────────────────────────
    // Подписки на списки
    function subscribeJudgeList() {
      clearListSub();
      unsubList = onValue(ref(db, 'matchList'), snap => {
        const list = snap.val() || {};
        const entries = Object.entries(list);
        const html = entries.length
          ? entries.map(([id, m]) => `
            <div class="list-item" data-id="${id}">
              <div><strong>${m.tournament}</strong><br><small>${m.playerLeft} vs ${m.playerRight}</small></div>
              <div style="text-align:right;"><span style="color:#ff9f0a;">${m.scoreSummary}</span><br><small>${m.phase}</small></div>
            </div>`).join('')
          : '<p style="color:#888;">Нет активных матчей</p>';
        $('#judgeMatchList').innerHTML = html;
        $$('#judgeMatchList .list-item').forEach(el => {
          el.onclick = () => {
            currentMatchId = el.dataset.id;
            subscribeMatch(currentMatchId);
            showScreen('match');
          };
        });
      });
    }

    function subscribeLiveList() {
      clearListSub();
      unsubList = onValue(ref(db, 'matchList'), snap => {
        const list = snap.val() || {};
        const entries = Object.entries(list).filter(([_, m]) => m.phase === 'playing' || m.phase === 'interrupted');
        const html = entries.length
          ? entries.map(([id, m]) => `
            <div class="list-item" data-id="${id}">
              <div><strong>${m.tournament}</strong><br><small>${m.playerLeft} vs ${m.playerRight}</small></div>
              <span style="color:#ff9f0a;">${m.scoreSummary}</span>
            </div>`).join('')
          : '<p style="color:#888;">Нет активных матчей</p>';
        $('#liveMatchList').innerHTML = html;
        $$('#liveMatchList .list-item').forEach(el => {
          el.onclick = () => {
            currentMatchId = el.dataset.id;
            subscribeMatch(currentMatchId);
            showScreen('broadcast');
          };
        });
      });
    }

    function subscribeTournaments() {
      clearListSub();
      unsubList = onValue(ref(db, 'tournaments'), snap => {
        const tours = snap.val() || {};
        const html = Object.entries(tours).length
          ? Object.entries(tours).map(([id, t]) => `
            <div class="list-item" data-id="${id}"><span>🏆 ${t.name}</span></div>`).join('')
          : '<p style="color:#888;">Нет турниров</p>';
        $('#tournamentList').innerHTML = html;
        $$('#tournamentList .list-item').forEach(el => {
          el.onclick = () => openTournament(el.dataset.id, tours[el.dataset.id]);
        });
      });
    }

    function openTournament(id, tour) {
      showScreen('tournament-detail');
      $('#detailTournamentName').textContent = tour.name;
      const container = $('#tournamentMatchesContainer');
      onValue(ref(db, 'matches'), snap => {
        const all = snap.val() || {};
        const matches = Object.entries(all).filter(([_, m]) => m.tournamentId === id);
        container.innerHTML = matches.length
          ? matches.map(([mid, m]) => `
            <div class="list-item">
              <div><strong>${m.players.left.name} vs ${m.players.right.name}</strong><br>
              <small>${m.score.sets.join(':')} | ${m.status.winner ? '🏆' + (m.status.winner === 'left' ? m.players.left.name : m.players.right.name) : (m.status.phase === 'playing' ? '🎾' : '⏸️')}</small></div>
            </div>`).join('')
          : '<p style="color:#888;">Нет матчей</p>';
      }, { onlyOnce: false });
    }

    function subscribeHistory() {
      clearListSub();
      unsubList = onValue(ref(db, 'matches'), snap => {
        const all = snap.val() || {};
        const finished = Object.entries(all)
          .filter(([_, m]) => m.status.phase === 'finished')
          .sort((a, b) => (b[1].finishedAt || 0) - (a[1].finishedAt || 0));
        const html = finished.length
          ? finished.map(([id, m]) => `
            <div class="list-item">
              <div><strong>${m.tournamentName || 'Турнир'}</strong><br>${m.players.left.name} vs ${m.players.right.name}</div>
              <div>${m.score.sets.join(':')} 🏆 ${m.status.winner === 'left' ? m.players.left.name : m.players.right.name}</div>
            </div>`).join('')
          : '<p style="color:#888;">Нет завершённых матчей</p>';
        $('#historyList').innerHTML = html;
      });
    }

    // ────────────────────────────────────
    // Инициализация форм
    function updatePlayerInputs() {
      const mode = $('#inpMode').value;
      const c = $('#playersInputs');
      if (mode === 'single') c.innerHTML = '<input id="pL" class="input" placeholder="Игрок слева"><input id="pR" class="input" placeholder="Игрок справа">';
      else if (mode === 'double') c.innerHTML = '<input id="pL1" class="input" placeholder="Левый 1"><input id="pL2" class="input" placeholder="Левый 2"><input id="pR1" class="input" placeholder="Правый 1"><input id="pR2" class="input" placeholder="Правый 2">';
      else if (mode === 'proam') c.innerHTML = '<input id="pLPro" class="input" placeholder="Про (левый)"><input id="pLAm" class="input" placeholder="Любитель (левый)"><input id="pRPro" class="input" placeholder="Про (правый)"><input id="pRAm" class="input" placeholder="Любитель (правый)">';
    }

    $('#inpMode').addEventListener('change', updatePlayerInputs);
    updatePlayerInputs();

    $('#btnNewTournament').addEventListener('click', async () => {
      const name = prompt('Название турнира:');
      if (name) { await createTournament(name); await loadTournamentSelect(); }
    });

    // ────────────────────────────────────
    // Обработчики кнопок
    $('#btnJudge').onclick = () => setRole('judge');
    $('#btnSpectator').onclick = () => setRole('spectator');
    $('#btnBackRoleJudge').onclick = $('#btnBackRoleSpec').onclick = () => {
      clearMatchSub(); clearListSub();
      currentRole = null; currentMatchId = null;
      $('#mainNav').style.display = 'none';
      showScreen('role');
    };
    $('#btnNewMatch').onclick = async () => { await loadTournamentSelect(); showScreen('setup'); };
    $('#btnBackSetup').onclick = () => { showScreen('judge-list'); };
    $('#btnCreateMatch').onclick = async () => {
      const tournamentId = $('#inpTournamentSelect').value;
      if (!tournamentId) return alert('Выберите турнир');
      const tournamentName = $('#inpTournamentSelect').options[$('#inpTournamentSelect').selectedIndex].text;
      const mode = $('#inpMode').value;
      let left, right;
      if (mode === 'single') {
        left = $('#pL').value.trim() || 'Игрок 1';
        right = $('#pR').value.trim() || 'Игрок 2';
      } else if (mode === 'double') {
        left = `${$('#pL1').value.trim()||'A1'} / ${$('#pL2').value.trim()||'A2'}`;
        right = `${$('#pR1').value.trim()||'B1'} / ${$('#pR2').value.trim()||'B2'}`;
      } else {
        left = `${$('#pLPro').value.trim()||'Про A'} (Pro) / ${$('#pLAm').value.trim()||'Люб A'} (Am)`;
        right = `${$('#pRPro').value.trim()||'Про B'} (Pro) / ${$('#pRAm').value.trim()||'Люб B'} (Am)`;
      }
      try {
        currentMatchId = await createMatchInDB({ tournamentId, tournamentName, mode, playerLeft: left, playerRight: right });
        subscribeMatch(currentMatchId);
        showScreen('match');
      } catch (e) { alert('Ошибка: ' + e.message); }
    };

    $('#btnPointLeft').onclick = () => addPoint('left');
    $('#btnPointRight').onclick = () => addPoint('right');
    $('#btnServeIn').onclick = () => recordServe('in');
    $('#btnServeMiss').onclick = () => recordServe('miss');
    $('#btnUndo').onclick = () => undoLastPoint();
    $('#btnEndMatch').onclick = endMatch;
    $('#btnInterruptMatch').onclick = async () => {
      const m = await get(ref(db, `matches/${currentMatchId}`));
      if (!m) return;
      if (m.status.winner || m.status.phase === 'finished') await deleteMatch();
      else await interruptMatch();
    };

    $('#btnBackSpecList').onclick = () => { clearMatchSub(); currentMatchId = null; showScreen('spec-list'); };
    $('#btnCreateTournament').onclick = async () => {
      const name = prompt('Название:');
      if (name) { await createTournament(name); subscribeTournaments(); }
    };
    $('#btnBackFromTournaments').onclick = () => {
      if (currentRole === 'judge') showScreen('judge-list');
      else showScreen('spec-list');
    };
    $('#btnBackToTournamentList').onclick = () => showScreen('tournaments');
    $('#btnBackFromHistory').onclick = () => {
      if (currentRole === 'judge') showScreen('judge-list');
      else showScreen('spec-list');
    };

    showScreen('role');
  </script>
</body>
</html>
